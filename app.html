    <section class="lab">
      <div class="card ctl">
        <div class="tabs" id="mode"><button class="on" data-v="flex">Flexbox</button><button data-v="grid">Grid</button></div>
        <div id="flexCtl"></div>
        <div id="gridCtl" hidden></div>
        <label class="field">Items <input type="range" id="count" min="1" max="12" value="5" /></label>
        <div class="field"><span>Presets</span><div class="chips" id="presets"></div></div>
      </div>
      <div class="stack">
        <div class="card">
          <div class="card-title"><h2>Preview</h2><span class="pill">click an item to edit it</span></div>
          <div class="stage" id="stage"></div>
        </div>
        <div class="card" id="itemCard" hidden>
          <div class="card-title"><h2 id="itemTitle">Item</h2><button class="btn small" id="itemReset">Reset item</button></div>
          <div class="grid g4" id="itemCtl"></div>
        </div>
        <div class="card">
          <div class="card-title"><h2>Code</h2><div class="row"><div class="tabs" id="fmt"><button class="on" data-v="css">CSS</button><button data-v="tw">Tailwind</button></div><button class="btn small primary" id="copy">Copy</button></div></div>
          <pre class="out" id="code"></pre>
        </div>
      </div>
    </section>
